name: Java compile
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: javac -Xlint:all NeonTankSiege.java Vector3D.java Mesh3D.java GameObject.java Display.java GameEngine.java
